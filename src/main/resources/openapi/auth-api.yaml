openapi: 3.0.1

info:
  title: Auth API
  description: APIs for user authentication
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Development

paths:
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: postLogin
      description: Logging in using username(email or username) and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"

      responses:
        "200":
          description: Login success

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          description: Account not found

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/register:
    post:
      tags:
        - Auth
      operationId: postRegister
      description: Registration for new user account.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"

      responses:
        "201":
          description: Register success

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          description: Failed to register

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/me:
    get:
      tags:
        - Auth
      operationId: getLoggedUserDetails
      details: Retrieving details for logged user
      security:
        - bearerAuth: []

      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      properties:
        userName:
          type: string
          description: Username of the user
        password:
          type: string
          description: Password of the user

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        refresh:
          type: string

    RegisterRequest:
      type: object
      properties:
        lastName:
          type: string
          example: "Doe"
        firstName:
          type: string
          example: "Jane"
        middleName:
          type: string
          example: "Brit"
        email:
          type: string
          format: email
        contactNumber:
          type: string
          example: "09101092245"
        roleId:
          type: integer
        password:
          type: string

    RegisterResponse:
      type: object
      properties:
        lastName:
          type: string
          example: "Doe"
        firstName:
          type: string
          example: "Jane"
        middleName:
          type: string
          example: "Brit"
        email:
          type: string
          format: email
        contactNumber:
          type: string
          example: "09101092245"
        role:
          type: string

  responses:
    Unauthorized:
      description: Authentication failed

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadRequest:
      description: Invalid request

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Access denied

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
