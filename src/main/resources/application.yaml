spring:
    application:
        name: sample-bms

    datasource:
        url: jdbc:mysql://localhost:3306/bmsdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
        username: root
        password: execadmin08
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            idle-timeout: 30000
            pool-name: HikariCP
            max-lifetime: 600000
            connection-timeout: 30000

    jpa:
        database: MYSQL
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
                format_sql: true
                use_sql_comments: true
                jdbc:
                    batch_size: 20
                order_inserts: true
                order_updates: true
        hibernate:
            ddl-auto: update
        open-in-view: false

    # Optional: Enable connection pool monitoring
    hikari:
        metrics:
            enabled: true

# Logging configuration
logging:
    level:
        org.hibernate.SQL: DEBUG
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE
        org.springframework.jdbc: DEBUG
